openapi: 3.0.0
info:
  title: SIGAP Malut Dashboard API
  version: 1.0.0
  description: >
    API resmi SIGAP-MALUT mencakup autentikasi, manajemen workflow, audit log,
    approval workflow, master data layanan, dan dashboard. Semua endpoint
    kecuali /api/auth/login dan /api/auth/register memerlukan Bearer token.
  contact:
    name: Tim SIGAP-MALUT
  license:
    name: Internal Use Only

servers:
  - url: /
    description: Backend server SIGAP-MALUT

security:
  - bearerAuth: []

paths:
  /api/public/summary:
    get:
      summary: Ringkasan dashboard publik
      description: >
        Mengembalikan KPI ringkas publik (agregat). Tidak memerlukan token.
      security: []
      tags: [Public]
      responses:
        "200":
          description: Ringkasan publik
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      last_updated_at: { type: string, format: date-time }
                      inflasi:
                        type: object
                        nullable: true
                        properties:
                          tanggal: { type: string, format: date }
                          inflasi_dod_persen: { type: number, nullable: true }
                          inflasi_mtd_persen: { type: number, nullable: true }
                          inflasi_yoy_proksi_persen: { type: number, nullable: true }
                          coverage_komoditas_persen: { type: number, nullable: true }
                      harga_pangan:
                        type: object
                        properties:
                          tanggal_terbaru: { type: string, format: date, nullable: true }
                      umkm:
                        type: object
                        properties:
                          umkm_tersertifikasi_count: { type: integer }
                      cppd:
                        type: object
                        description: CPPD Provinsi Maluku Utara (agregat dari stok gudang bertanda CPPD)
                        properties:
                          status_keseluruhan:
                            type: string
                            nullable: true
                            enum: [aman, waspada, kritis]
                          tanggal_data:
                            type: string
                            format: date
                            nullable: true
                          stok_cadangan:
                            type: array
                            items:
                              type: object
                          catatan: { type: string }
                          meta: { type: object, additionalProperties: true }
                      catatan:
                        type: object
                        properties:
                          inflasi: { type: string }
                          harga: { type: string }
                          cppd: { type: string }

  /api/public/cppd/summary:
    get:
      summary: Ringkasan CPPD publik (Provinsi Maluku Utara)
      description: >
        Agregat cadangan pangan pemerintah daerah dari stok_pangan dengan
        filter lokasi_gudang (CPPD / Cadangan Pemerintah / Badan Pangan).
      security: []
      tags: [Public]
      responses:
        "200":
          description: Ringkasan CPPD
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      status_keseluruhan:
                        type: string
                        nullable: true
                      tanggal_data:
                        type: string
                        format: date
                        nullable: true
                      stok_cadangan:
                        type: array
                        items:
                          type: object
                      catatan: { type: string }
                      meta: { type: object }

  /api/public/datasets:
    get:
      summary: Daftar dataset publik
      description: >
        Daftar dataset publik yang dapat digunakan masyarakat/peneliti.
      security: []
      tags: [Public]
      responses:
        "200":
          description: Daftar dataset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        description: { type: string }
                        last_updated: { type: string, format: date, nullable: true }
                        endpoints:
                          type: object
                          additionalProperties: true

  /api/public/inflasi/trend:
    get:
      summary: Tren inflasi harian (proksi internal)
      description: Data tren untuk kebutuhan visualisasi publik.
      security: []
      tags: [Public]
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 30, maximum: 366 }
      responses:
        "200":
          description: Tren inflasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tanggal: { type: string, format: date }
                        inflasi_dod_persen: { type: number, nullable: true }
                        inflasi_mtd_persen: { type: number, nullable: true }
                        inflasi_yoy_proksi_persen: { type: number, nullable: true }
                        indeks_laspeyres: { type: number }

  /api/public/harga/trend:
    get:
      summary: Tren harga pangan harian (rerata terverifikasi)
      description: Mengembalikan rerata harian per komoditas_key.
      security: []
      tags: [Public]
      parameters:
        - in: query
          name: komoditas_key
          required: true
          schema: { type: string, example: beras_medium }
        - in: query
          name: days
          schema: { type: integer, default: 30, maximum: 366 }
      responses:
        "200":
          description: Tren harga
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tanggal: { type: string, format: date }
                        harga_avg: { type: number }
                        n: { type: integer }

  /api/public/datasets/harga-pangan.csv:
    get:
      summary: Download CSV tren harga pangan
      description: File CSV agregat harian per komoditas_key.
      security: []
      tags: [Public]
      parameters:
        - in: query
          name: komoditas_key
          required: true
          schema: { type: string }
        - in: query
          name: days
          schema: { type: integer, default: 30, maximum: 366 }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /api/auth/login:
    post:
      summary: Login pengguna
      description: Autentikasi pengguna dan kembalikan JWT token.
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: "secret"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      summary: Logout pengguna
      description: Invalidasi sesi aktif pengguna.
      tags: [Auth]
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      summary: Ambil profil pengguna aktif
      description: Kembalikan data pengguna berdasarkan token yang aktif.
      tags: [Auth]
      responses:
        "200":
          description: Data profil pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/change-password:
    put:
      summary: Ganti password pengguna
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        "200":
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Password lama tidak cocok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/workflow:
    get:
      summary: Daftar semua workflow
      description: Ambil seluruh workflow yang terdaftar di sistem.
      tags: [Workflow]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, approved, rejected]
          description: Filter berdasarkan status workflow
      responses:
        "200":
          description: Daftar workflow
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Buat workflow baru
      tags: [Workflow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "201":
          description: Workflow berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/workflow/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: ID workflow
    get:
      summary: Ambil workflow berdasarkan ID
      tags: [Workflow]
      responses:
        "200":
          description: Data workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Perbarui workflow
      tags: [Workflow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "200":
          description: Workflow berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Hapus workflow
      tags: [Workflow]
      responses:
        "200":
          description: Workflow berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/approvalworkflow:
    get:
      summary: Daftar semua approval workflow
      description: Ambil seluruh data approval workflow untuk audit dan pelacakan persetujuan.
      tags: [ApprovalWorkflow]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
          description: Filter berdasarkan status approval
      responses:
        "200":
          description: Daftar approval workflow
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalWorkflow"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Buat approval workflow baru
      description: Kirim permintaan approval baru ke dalam antrian persetujuan.
      tags: [ApprovalWorkflow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalWorkflowInput"
      responses:
        "201":
          description: Approval workflow berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalWorkflow"
        "400":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/approvalworkflow/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: ID approval workflow
    get:
      summary: Ambil approval workflow berdasarkan ID
      tags: [ApprovalWorkflow]
      responses:
        "200":
          description: Data approval workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalWorkflow"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Perbarui status approval workflow
      description: Setujui atau tolak sebuah approval workflow.
      tags: [ApprovalWorkflow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                catatan:
                  type: string
      responses:
        "200":
          description: Status approval berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalWorkflow"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auditlog:
    get:
      summary: Daftar audit log
      description: Ambil log aktivitas sistem untuk keperluan audit forensik.
      tags: [AuditLog]
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
          description: Filter berdasarkan user ID
        - name: action
          in: query
          schema:
            type: string
          description: Filter berdasarkan jenis aksi (login, approve, reject, dll.)
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Tanggal mulai (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Tanggal akhir (YYYY-MM-DD)
      responses:
        "200":
          description: Daftar audit log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auditlog/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: ID audit log
    get:
      summary: Ambil detail satu entri audit log
      tags: [AuditLog]
      responses:
        "200":
          description: Detail audit log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLog"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/layanan:
    get:
      summary: Daftar semua layanan
      description: Kembalikan katalog master data layanan yang tersedia di sistem.
      tags: [Layanan]
      responses:
        "200":
          description: Daftar layanan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Layanan"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Tambah layanan baru
      tags: [Layanan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayananInput"
      responses:
        "201":
          description: Layanan berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layanan"
        "400":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/layanan/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: ID layanan
    get:
      summary: Ambil layanan berdasarkan ID
      tags: [Layanan]
      responses:
        "200":
          description: Data layanan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layanan"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Perbarui layanan
      tags: [Layanan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayananInput"
      responses:
        "200":
          description: Layanan berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layanan"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Hapus layanan
      tags: [Layanan]
      responses:
        "200":
          description: Layanan berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/dashboard/super-admin/summary:
    get:
      summary: Ringkasan dashboard Super Admin
      description: |
        Agregat sistem (pengguna, audit, tugas lintas unit, compliance 30 hari).
        Hanya role `super_admin`. Respons di-cache singkat (≈60 dtk).
      tags: [Dashboard]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ringkasan System Control Center
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      users:
                        type: object
                        properties:
                          total: { type: integer }
                          active: { type: integer }
                      auditLog:
                        type: object
                        properties:
                          entriesTotal: { type: integer }
                      compliance:
                        type: object
                      tasks:
                        type: object
                      workflow:
                        type: object
                      generatedAt:
                        type: string
                        format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Bukan super_admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/dashboard/sekretaris/summary:
    get:
      summary: Dashboard summary Sekretaris
      description: Kembalikan KPI dan alert ringkasan untuk role Sekretariat.
      tags: [Dashboard]
      responses:
        "200":
          description: Summary data dashboard Sekretaris
          content:
            application/json:
              schema:
                type: object
                properties:
                  kpis:
                    type: array
                    items:
                      $ref: "#/components/schemas/Kpi"
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/gubernur/dashboard/cockpit:
    get:
      summary: Cockpit eksekutif Gubernur (satu layar keputusan)
      description: >
        Prioritas hari ini, antrean maks. 5 (pengajuan + instruksi kritis),
        peringatan pola, KPI dengan tren, dan meta audit modul.
      tags: [Executive, Gubernur]
      responses:
        "200":
          description: Payload cockpit
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      generated_at: { type: string, format: date-time }
                      prioritas_hari_ini:
                        type: array
                        items:
                          type: object
                      yang_harus_diputuskan:
                        type: array
                        description: Gabungan pengajuan dan instruksi, max 5
                      highlight_masalah:
                        type: array
                      smart_kpi:
                        type: object
                      meta:
                        type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/kadin/dashboard/cockpit:
    get:
      summary: Cockpit prioritas Kepala Dinas
      description: >
        Instruksi prioritas Gubernur, mendekati deadline, skor performa 90 hari,
        pengajuan ke Gubernur yang dikembalikan.
      tags: [Executive, KepalaDinas]
      responses:
        "200":
          description: Payload cockpit Kadis
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/execution-thread/hub/summary:
    get:
      summary: Ringkasan hub eksekusi multi-level per peran
      description: >
        Daftar thread eksekusi yang dapat diakses pengguna (Gubernur, Kadis, Sekretaris, Kabid, UPTD)
        beserta KPI hierarkis sampel per thread.
      tags: [Executive, ExecutionThread]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ringkasan hub
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/execution-thread/{id}:
    get:
      summary: Timeline lengkap satu execution thread
      description: >
        Instruksi, tugas, log tugas, pengajuan, klarifikasi, dan event thread — terurut waktu.
      tags: [Executive, ExecutionThread]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Timeline dan KPI hierarki
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      execution_thread_id: { type: string, format: uuid }
                      timeline:
                        type: array
                        items:
                          type: object
                      aktivitas:
                        type: array
                        items:
                          type: object
                      kpi_hierarki:
                        type: object
        "400":
          description: UUID tidak valid
        "403":
          description: Akses ditolak
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/coordination/horizontal/dashboard/sekretaris:
    get:
      tags: [CoordinationHorizontal, Dashboard]
      summary: Dashboard koordinasi horizontal — Sekretaris
      description: >
        Ringkasan operasional lintas bidang untuk Sekretaris: antrean prioritas, item melewati SLA,
        unit yang lambat merespons, thread yang tertahan koordinasi, dan tugas lapangan terkait thread.
        Memerlukan peran Sekretaris atau super_admin.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string }
          description: Filter status persis (mis. diajukan, diproses).
        - name: level
          in: query
          schema: { type: string }
          description: Filter org level sumber/tujuan (mis. kabid, sekretaris).
        - name: unit
          in: query
          schema: { type: string }
          description: Substring pencarian pada from_unit / to_unit.
        - name: sla
          in: query
          schema: { type: string, enum: [overdue] }
          description: Jika overdue, hanya item terbuka yang melewati sla_due_at.
      responses:
        "200":
          description: Payload dashboard Sekretaris
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorizontalCoordinationDashboardEnvelope"
        "403":
          description: Akses ditolak
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/coordination/horizontal/dashboard/kabid:
    get:
      tags: [CoordinationHorizontal, Dashboard]
      summary: Dashboard koordinasi horizontal — Kepala Bidang
      description: >
        Scope permintaan masuk/keluar dan dependensi lintas unit untuk satu Kabid (berdasarkan unit_kerja
