  /api/coordination/horizontal:
    post:
      tags: [CoordinationHorizontal]
      summary: Buat permintaan koordinasi horizontal pada thread
      description: >
        Mencatat koordinasi lintas unit pada execution_thread_id yang sama; memicu execution_thread_events
        dan muncul di timeline sebagai kind koordinasi_horizontal.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HorizontalCoordinationCreate"
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/HorizontalCoordinationRequest"
        "400":
          description: Validasi gagal / thread wajib
        "403":
          description: Akses thread ditolak
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/coordination/horizontal/{id}/status:
    patch:
      tags: [CoordinationHorizontal]
      summary: Ubah status alur koordinasi (non-terminal / pembatalan / gagal dari terlambat)
      description: >
        State machine resmi (backend `horizontalCoordinationStateMachine.js`):
        diajukan→diterima→diproses↔menunggu_balasan; diproses/menunggu_balasan→terlambat; terlambat→diproses|gagal_koordinasi|dibatalkan;
        pembatalan jalur `dibatalkan` mengikuti peta transisi per status saat ini.
        Untuk menutup dengan **selesai** atau **ditolak** gunakan `PATCH .../respond`.
        Aktor: pengirim/penerima terkait, super_admin; Sekretaris jika `to_user_id` null.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HorizontalCoordinationPatchStatusBody"
            examples:
              terima:
                summary: Terima permintaan
                value: { status: diterima }
              proses:
                summary: Mulai proses
                value: { status: diproses }
              tunggu:
                summary: Tunggu balasan pihak lain
                value: { status: menunggu_balasan }
              sla_terlambat:
                summary: Tandai terlambat
                value: { status: terlambat }
              batal:
                summary: Batalkan jalur
                value: { status: dibatalkan }
              gagal_setelah_sla:
                summary: Gagal koordinasi (hanya jika status saat ini terlambat)
                value: { status: gagal_koordinasi }
      responses:
        "200":
          description: Diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/HorizontalCoordinationRequest"
              examples:
                ok:
                  value:
                    success: true
                    data:
                      id: 42
                      execution_thread_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      status: diterima
        "400":
          description: Status / transisi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorizontalCoordinationErrorBody"
              examples:
                transisi_ilegal:
                  value:
                    success: false
                    code: HCOORD_INVALID_TRANSITION
                    message: Transisi dari "diajukan" ke "diproses" tidak diizinkan.
                    validation:
                      from_status: diajukan
                      to_status: diproses
                      allowed_to: [diterima, dibatalkan]
                pakai_respond:
                  value:
                    success: false
                    code: HCOORD_USE_RESPOND_ENDPOINT
                    message: Untuk menutup dengan selesai atau ditolak gunakan PATCH .../respond.
        "403":
          description: Bukan pihak terkait (HCOORD_FORBIDDEN_ACTOR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorizontalCoordinationErrorBody"
        "404":
          description: Item tidak ditemukan (KOORDINASI_TIDAK_DITEMUKAN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorizontalCoordinationErrorBody"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/coordination/horizontal/{id}/respond:
    patch:
      tags: [CoordinationHorizontal]
      summary: Tutup / balas koordinasi horizontal
      description: >
        Penutupan formal: **selesai**, **ditolak**, **dibatalkan** dari alur terbuka;
        **gagal_koordinasi** hanya jika status saat ini **terlambat** (konsisten dengan PATCH status).
        Menyimpan `response_body`, `responded_at`, `responded_by_user_id`.
        Penerima yang dituju atau super_admin.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [selesai, dibatalkan, ditolak, gagal_koordinasi]
                response_body:
                  type: string
            examples:
              selesai:
                value:
                  status: selesai
                  response_body: "Data disepakati; lanjut ke tugas terkait."
              tolak:
                value:
                  status: ditolak
                  response_body: "Tidak dapat memenuhi karena keterbatasan kapasitas."
      responses:
        "200":
          description: Diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/HorizontalCoordinationRequest"
        "400":
          description: Validasi penutupan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorizontalCoordinationErrorBody"
        "403":
          description: Bukan penerima (HCOORD_FORBIDDEN_ACTOR)
        "404":
          description: KOORDINASI_TIDAK_DITEMUKAN
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operasi berhasil

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Terjadi kesalahan

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          description: JWT token
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum:
            [
              super_admin,
              sekretariat,
              uptd,
              bidang_ketersediaan,
              bidang_distribusi,
              bidang_konsumsi,
              kepala_dinas,
              publik,
            ]
        name:
          type: string
        email:
          type: string
          format: email

    Workflow:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [draft, submitted, approved, rejected]
        createdBy:
          type: integer
          description: User ID pembuat
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkflowInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [draft, submitted]
          default: draft

    ApprovalWorkflow:
      type: object
      properties:
        id:
          type: integer
        workflowId:
          type: integer
        approver:
          type: integer
          description: User ID approver
        status:
          type: string
          enum: [pending, approved, rejected]
        catatan:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApprovalWorkflowInput:
      type: object
      required: [workflowId]
      properties:
        workflowId:
          type: integer
        catatan:
          type: string

    AuditLog:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        role:
          type: string
        action:
          type: string
          description: Jenis aksi (login, approve, reject, update, delete, dll.)
        endpoint:
          type: string
        entityId:
          type: string
        statusResult:
          type: string
        ipAddress:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time

    Layanan:
      type: object
      properties:
        id:
          type: integer
        kode:
          type: string
        nama:
          type: string
        deskripsi:
          type: string
        sla:
          type: string
          description: SLA target (e.g. "2 hari kerja")
        owner:
          type: string
        aktif:
          type: boolean

    LayananInput:
      type: object
      required: [kode, nama]
      properties:
        kode:
          type: string
        nama:
          type: string
        deskripsi:
          type: string
        sla:
          type: string
        owner:
          type: string
        aktif:
          type: boolean
          default: true

    Kpi:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: number
        unit:
          type: string
        trend:
          type: array
          items:
            type: number

    Alert:
      type: object
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [KRITIS, TINGGI, SEDANG, INFO]
        title:
          type: string
        summary:
          type: string

    HorizontalCoordinationDashboardEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: >
            Isi bervariasi per endpoint (summary, priority_queue, insights, role_lens, dll.).
            Lihat dokumenSistem/dashboard-role-coordination-widgets.md untuk contoh JSON per peran.

    HorizontalCoordinationRequest:
      type: object
      properties:
        id: { type: integer }
        execution_thread_id: { type: string, format: uuid }
        coordination_kind: { type: string, example: sync_request }
        status:
          type: string
          description: >
            Alur terbuka diajukan, diterima, diproses, menunggu_balasan, terlambat;
            penutupan selesai, dibatalkan, ditolak, gagal_koordinasi.
        subject: { type: string, nullable: true }
        body: { type: string, nullable: true }
        from_user_id: { type: integer }
        to_user_id: { type: integer, nullable: true }
        from_unit: { type: string, nullable: true }
        to_unit: { type: string, nullable: true }
        from_org_level: { type: string, nullable: true }
        to_org_level: { type: string, nullable: true }
        sla_due_at: { type: string, format: date-time, nullable: true }
        responded_at: { type: string, format: date-time, nullable: true }
        response_body: { type: string, nullable: true }
        surat_masuk_id: { type: integer, nullable: true }
        task_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HorizontalCoordinationCreate:
      type: object
      required: [execution_thread_id]
      properties:
        execution_thread_id: { type: string, format: uuid }
        coordination_kind: { type: string, default: sync_request }
        subject: { type: string }
        body: { type: string }
        to_user_id: { type: integer, nullable: true }
        to_unit: { type: string }
        from_org_level: { type: string }
        to_org_level: { type: string }
        sla_hours: { type: number, description: "Hitungan jam dari sekarang untuk sla_due_at" }
        surat_masuk_id: { type: integer }
        task_id: { type: integer }

    HorizontalCoordinationPatchStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: >
            Alur kerja (non-terminal) atau pembatalan/gagal sesuai state machine.
            `gagal_koordinasi` hanya valid dari status `terlambat`.
            `selesai`/`ditolak` tidak lewat endpoint ini — gunakan `/respond`.
          enum:
            [
              diterima,
              diproses,
              menunggu_balasan,
              terlambat,
              dibatalkan,
              gagal_koordinasi,
            ]

    HorizontalCoordinationErrorBody:
      type: object
      properties:
        success: { type: boolean, example: false }
        code:
          type: string
          description: >
            Kode stabil untuk QA/automasi, mis. THREAD_WAJIB, KOORDINASI_TIDAK_DITEMUKAN,
            HCOORD_INVALID_TRANSITION, HCOORD_USE_RESPOND_ENDPOINT, HCOORD_ALREADY_CLOSED,
            HCOORD_GAGAL_REQUIRES_TERLAMBAT, HCOORD_FORBIDDEN_ACTOR, HCOORD_STATUS_INVALID.
        message: { type: string }
        validation:
          type: object
          description: Detail transisi (from_status, to_status, allowed_to) bila relevan
          additionalProperties: true

# ==============================================================================
# ENDPOINT BARU — Ditambahkan v2.2 (BL-001, BL-002, BL-011 fixes)
# Tanggal sync: 2026-04-05 · Branch: audit/pilot-hardening-release
# ==============================================================================

  /api/tasks/{id}/submit:
    post:
      summary: Submit hasil tugas untuk diverifikasi atasan
      description: >
        Pelaksana mengirim hasil tugas ke atasan (Kasubag/Sekretaris) untuk diverifikasi.
        Status tugas berubah dari `in_progress` → `submitted`.

        **Validasi wajib (BL-002):**
        - `output_ringkas` minimal 50 karakter
        - Untuk tugas dengan kata kunci ASN/kepegawaian di judul: `output_url` wajib diisi (min. 8 karakter)
        - Task harus berstatus `in_progress` (enforced oleh state machine)
      tags: [Tasks - Workflow]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: ID tugas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [output_ringkas]
              properties:
                output_ringkas:
                  type: string
                  minLength: 50
                  description: Ringkasan hasil kerja, minimal 50 karakter
                  example: "Data ASN Dinas Pangan telah direkap sebanyak 45 orang, dipisahkan per golongan I-IV dan sudah diprint."
                output_url:
                  type: string
                  description: >
                    Tautan lampiran/berkas hasil. Wajib untuk tugas bertajuk ASN/kepegawaian.
                  example: "https://drive.example.com/file/xyz"
                note:
                  type: string
                  description: Catatan tambahan (opsional)
      responses:
        "200":
          description: Tugas berhasil disubmit
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      status: { type: string, example: submitted }
                      metadata:
                        type: object
                        properties:
                          pelaksana_submit:
                            type: object
                            properties:
                              output_ringkas: { type: string }
                              output_url: { type: string, nullable: true }
                              submitted_at: { type: string, format: date-time }
                              submitted_by: { type: integer }
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  code:
                    type: string
                    enum: [OUTPUT_TOO_SHORT, URL_REQUIRED]
                    description: >
                      OUTPUT_TOO_SHORT = ringkasan kurang dari 50 karakter.
                      URL_REQUIRED = tugas ASN/kepegawaian butuh output_url.
                  message: { type: string }
        "401":
          description: Token tidak valid atau tidak ada
        "403":
          description: >
            Role tidak diizinkan submit, atau status tugas bukan `in_progress`
            (state machine violation)
        "404":
          description: Tugas tidak ditemukan
        "429":
          description: >
            Rate limit terlampaui (submit limiter: max 10 req/menit di produksi).
            Header `Retry-After` tersedia.

  /api/tasks/{id}/review:
    post:
      summary: Sekretaris memproses keputusan atas tugas yang sudah diverifikasi
      description: >
        Sekretaris (atau super_admin) memutuskan nasib tugas yang sudah berstatus `verified`.
        Tiga pilihan keputusan:
        - `approve` → status: `approved_by_secretary`
        - `back` → status: `in_progress` (kembalikan untuk revisi)
        - `forward` → status: `forwarded_to_kadin`

        Dicatat di `Approvals` dan `TaskLogs`.
      tags: [Tasks - Workflow]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: ID tugas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, back, forward]
                  description: >
                    approve = setujui (→ approved_by_secretary);
                    back = kembalikan untuk revisi (→ in_progress);
                    forward = teruskan ke Kadis (→ forwarded_to_kadin)
                note:
                  type: string
                  description: Catatan keputusan (wajib jika decision = back)
      responses:
        "200":
          description: Keputusan berhasil diproses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      status:
                        type: string
                        enum: [approved_by_secretary, in_progress, forwarded_to_kadin]
        "403":
          description: Role bukan sekretaris/super_admin, atau status tugas bukan `verified`
        "404":
          description: Tugas tidak ditemukan
        "401":
          description: Token tidak valid

  /api/sekretaris/tugas-terverifikasi:
    get:
      summary: List tugas yang sudah diverifikasi Kasubag — menunggu keputusan Sekretaris
      description: >
        Mengembalikan semua tugas dengan status `verified` yang perlu diproses
        Sekretaris. Digunakan oleh `ReviewTugasVerifiedPanel.jsx` di Dashboard Sekretaris.

        Hanya dapat diakses oleh role `sekretaris` atau `super_admin`
        (dijaga oleh `sekretarisGuard` middleware).
      tags: [Sekretaris - Workflow]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: List tugas terverifikasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        status: { type: string, example: verified }
                        due_date: { type: string, format: date-time, nullable: true }
                        source_unit: { type: string, nullable: true }
                        updated_at: { type: string, format: date-time }
                        metadata:
                          type: object
                          nullable: true
                          properties:
                            pelaksana_submit:
                              type: object
                              nullable: true
                              properties:
                                output_ringkas: { type: string }
                                output_url: { type: string, nullable: true }
                                submitted_at: { type: string, format: date-time }
                        creator:
                          type: object
                          nullable: true
                          properties:
                            id: { type: integer }
                            nama_lengkap: { type: string }
                        assignees:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: integer }
                              status: { type: string }
                              assignee:
                                type: object
                                properties:
                                  id: { type: integer }
                                  nama_lengkap: { type: string }
                                  role: { type: string }
                                  unit_kerja: { type: string, nullable: true }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      pages: { type: integer }
        "401":
          description: Token tidak valid
        "403":
          description: Role bukan sekretaris/super_admin

  /api/kasubag/bawahan:
    get:
      summary: List staf pelaksana yang dapat menerima penugasan dari Kasubag
      description: >
        Mengembalikan daftar staf bawahan langsung (dari `UserHierarchy`) atau
        fallback ke staf satu `unit_kerja` jika hierarki belum terisi.
        Field `meta.source` menunjukkan sumber data: `hierarchy` | `same_unit` | `none`.
      tags: [Kasubag - Penugasan]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List staf
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        nama_lengkap: { type: string }
                        username: { type: string }
                        role: { type: string }
                        unit_kerja: { type: string, nullable: true }
                  meta:
                    type: object
                    properties:
                      source:
                        type: string
                        enum: [hierarchy, same_unit, none]
                        description: >
                          hierarchy = dari tabel UserHierarchy;
                          same_unit = fallback unit_kerja;
                          none = tidak ada staf ditemukan
        "401":
          description: Token tidak valid

  /api/kasubag/verifikasi/{id}/ok:
    post:
      summary: Kasubag menyatakan berkas tugas sudah OK (verified)
      description: >
        Mengubah status tugas dari `submitted` → `verified`.
        Dicatat di TaskLogs dan notifikasi dikirim ke pembuat tugas.
      tags: [Kasubag - Verifikasi]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Verifikasi berhasil
        "400":
          description: Status tugas bukan submitted
        "403":
          description: Role tidak diizinkan
        "404":
          description: Tugas tidak ditemukan

  /api/kasubag/verifikasi/{id}/kembalikan:
    post:
      summary: Kasubag mengembalikan berkas tugas ke pelaksana untuk direvisi
      description: >
        Mengubah status tugas dari `submitted` → `returned_to_pelaksana`.
        Body berisi `catatan` alasan pengembalian.
      tags: [Kasubag - Verifikasi]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                catatan: { type: string, description: Alasan pengembalian }
      responses:
        "200":
          description: Berkas dikembalikan
        "403":
          description: Role tidak diizinkan
        "404":
          description: Tugas tidak ditemukan
